<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="BERLICRM_CONTACTS"></title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="contacts.css?v=20261111.11" />
  <script src="language.js?v=20261111.11"></script>
  <script src="contacts-auth-relay.js?v=20261108.5"></script>
</head>
<body class="contacts-pane">
  <nav><a href="taskpane.html" data-i18n="BACK_TO_MAIL_AND_CALENDAR"></a></nav>
  <header class="contacts-header"><img src="assets/icon-80.png" width="32" height="32" alt="" /><h1 data-i18n="BERLICRM_CONTACTS"></h1></header>
  <p class="contacts-intro" data-i18n="CONTACTS_PANE_INTRO"></p>
  <p id="contactSessionNotice" class="session-notice" role="alert" hidden></p>
  <section class="contacts-login">
    <h2 data-i18n="CRM_SIGN_IN"></h2>
    <form id="contactLoginForm">
      <label for="contactUsername" data-i18n="USERNAME"></label>
      <input id="contactUsername" autocomplete="username" required />
      <label for="contactAccessKey" data-i18n="ACCESS_KEY"></label>
      <input id="contactAccessKey" type="password" autocomplete="current-password" required />
      <button type="submit" data-i18n="SIGN_IN_TO_CRM"></button>
    </form>
    <p id="contactLoginStatus" role="status" aria-live="polite"></p>
    <button id="contactRetry" type="button" hidden data-i18n="TRY_AGAIN"></button>
    <button id="contactLogout" type="button" hidden data-i18n="USE_ANOTHER_ACCOUNT"></button>
  </section>
  <div id="contactWorkspace" hidden>
    <section class="contacts-connection">
      <p id="contactMicrosoftStatus" role="status" aria-live="polite" data-i18n="PREPARING_MICROSOFT_CONNECTION"></p>
      <details id="contactAutoDetails" hidden>
        <summary data-i18n="TECHNICAL_DETAILS"></summary>
        <p id="contactAutoError" class="record-status"></p>
      </details>
      <div id="contactMicrosoftLogin" hidden>
        <p data-i18n="CONNECT_THE_ACCOUNT_WHOSE_PERSONAL_OUTLOOK_CONTACTS_YOU_WANT_TO_TRANSFER"></p>
        <div class="actions"><button id="contactConnect" type="button" data-i18n="CONNECT_TO_MICROSOFT"></button></div>
      <button id="contactCancelAuth" type="button" hidden data-i18n="CANCEL_MICROSOFT_SIGN_IN"></button>
      </div>
      <details id="contactConnectionOptions" open>
      <summary data-i18n="CONTACTS_ACCOUNT_AND_FOLDER"></summary>
      <div class="actions"><button id="contactDisconnect" type="button" hidden data-i18n="DISCONNECT"></button></div>
      <label for="contactFolder" data-i18n="OUTLOOK_CONTACT_FOLDER_FOR_IMPORT_AND_EXPORT"></label>
      <select id="contactFolder" disabled><option value="" data-i18n="DEFAULT_CONTACTS"></option></select>
      <button id="contactLoadFolders" type="button" disabled data-i18n="LOAD_MORE_FOLDERS"></button>
      </details>
    </section>
    <div id="contactViewTabs" class="contacts-tabs" role="tablist" data-i18n-aria-label="CONTACTS_VIEW">
      <button id="contactShowOutlook" type="button" role="tab" aria-controls="contactOutlookSection" aria-selected="true"><span data-i18n="CONTACTS_OUTLOOK_TAB"></span><span id="contactOutlookCount" class="contacts-count" hidden></span></button>
      <button id="contactShowCrm" type="button" role="tab" aria-controls="contactCrmSection" aria-selected="false" tabindex="-1"><span data-i18n="CONTACTS_CRM_TAB"></span><span id="contactCrmCount" class="contacts-count" hidden></span></button>
    </div>
    <div class="contacts-panels">
    <section id="contactOutlookSection" role="tabpanel" aria-labelledby="contactShowOutlook" tabindex="0">
      <h2 data-i18n="OUTLOOK_CRM"></h2>
      <p id="contactRequiredFields"></p>
      <p data-i18n="ONLY_COMPLETE_CONTACTS_ARE_CREATED_EXISTING_CONTACTS_ARE_SKIPPED"></p>
      <div class="actions">
        <button id="contactLoadOutlook" type="button" disabled data-i18n="LOAD_OUTLOOK_CONTACTS"></button>
        <button id="contactMoreOutlook" type="button" hidden data-i18n="LOAD_MORE_CONTACTS"></button>
        <button id="contactSelectOutlook" type="button" data-i18n="SELECT_ALL_COMPLETE_CONTACTS"></button>
        <button id="contactImport" type="button" disabled data-i18n="IMPORT_SELECTED_INTO_CRM"></button>
      </div>
      <div id="contactOutlookResults" class="results"></div>
    </section>
    <section id="contactCrmSection" role="tabpanel" aria-labelledby="contactShowCrm" tabindex="0" hidden>
      <h2 data-i18n="CRM_OUTLOOK"></h2>
      <form id="contactSearchForm">
        <label for="contactSearch" data-i18n="FIND_A_PERSON_IN_CRM"></label>
        <input id="contactSearch" data-i18n-placeholder="NAME_OR_EMAIL" placeholder="" required />
        <button type="submit" data-i18n="SEARCH"></button>
      </form>
      <div id="contactCrmPager" class="contacts-pagination" hidden>
        <p id="contactCrmPageStatus" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="contactCrmPrevious" type="button" disabled data-i18n="CONTACTS_PREVIOUS_PAGE"></button>
          <button id="contactCrmNext" type="button" disabled data-i18n="CONTACTS_NEXT_PAGE"></button>
        </div>
        <p class="contacts-page-hint" data-i18n="CONTACTS_PAGE_SELECTION_HINT"></p>
      </div>
      <div class="actions">
        <button id="contactSelectCrm" type="button" data-i18n="SELECT_ALL_RESULTS"></button>
        <button id="contactExport" type="button" disabled data-i18n="CREATE_SELECTED_AS_OUTLOOK_CONTACTS"></button>
      </div>
      <div id="contactCrmResults" class="results"></div>
    </section>
    </div>
    <p id="contactTransferStatus" role="status" aria-live="polite"></p>
  </div>
  <footer class="addin-credit">
    <span class="addin-version" data-i18n="ADDIN_VERSION"></span>
    <span class="addin-version">Build 20261111.11</span>
    <span data-i18n="PROUDLY_MADE_IN_BERLIN_BY_CRM_NOW_GMBH"></span>
  </footer>
  <script src="contact-model.js?v=20261105.1"></script>
  <script src="contact-graph.js?v=20261105.1"></script>
  <script src="assets/contacts-sso.bundle.js?v=20261111.3"></script>
  <script src="contacts-layout.js?v=20261111.11"></script>
  <script src="contacts.js?v=20261111.11"></script>
</body>
</html>
