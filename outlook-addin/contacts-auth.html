<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title data-i18n="BERLICRM_MICROSOFT_SIGN_IN"></title>
  <link rel="stylesheet" href="contacts-auth.css?v=20261105.1" />
  <script src="language.js?v=20261111.6"></script>
  <script src="contacts-auth-relay.js?v=20261108.5"></script>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand"><img src="assets/icon-80.png" width="36" height="36" alt="" /><span>berliCRM <span class="brand-divider">/</span> <span data-i18n="OUTLOOK"></span></span></div>
    <section class="auth-card" id="authCard" data-state="loading" aria-labelledby="authTitle">
      <div class="auth-icon" aria-hidden="true">
        <span class="auth-spinner"></span>
        <svg class="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <svg class="icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 12 3 3 7-7"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <p class="auth-eyebrow" data-i18n="CONNECT_MICROSOFT_ACCOUNT"></p>
      <h1 id="authTitle" data-i18n="PREPARING_SIGN_IN"></h1>
      <p id="authStatus" class="auth-description" role="status" aria-live="polite" data-i18n="ONE_MOMENT_PLEASE_YOU_WILL_BE_REDIRECTED_TO_MICROSOFT_SHORTLY"></p>
      <div id="authHelp" class="auth-help" hidden>
        <h2 data-i18n="NEXT_STEPS"></h2>
        <p data-i18n="TRY_SIGNING_IN_AGAIN_IF_ACCESS_IS_STILL_DENIED_ASK_YOUR_MICROSOFT_365_AD"></p>
        <p id="authReturnHelp" class="auth-return"><span data-i18n="YOU_CAN_ALSO_CLOSE_THIS_WINDOW_AND_SELECT"></span> <strong data-i18n="CONNECT_TO_MICROSOFT_QUOTED"></strong> <span data-i18n="AGAIN_IN_WORD"></span></p>
      </div>
      <div id="authActions" class="auth-actions" hidden><button id="authRetry" type="button"><span data-i18n="TRY_AGAIN"></span> <span aria-hidden="true">→</span></button></div>
      <details id="authDetails" class="auth-details" hidden>
        <summary data-i18n="TECHNICAL_DETAILS"></summary>
        <pre id="authErrorDetails"></pre>
      </details>
    </section>
    <p class="auth-footer" data-i18n="CONNECTION_TO_YOUR_PERSONAL_OUTLOOK_CONTACTS"></p>
  </main>
  <script src="assets/contacts-auth.bundle.js?v=20261111.7"></script>
</body>
</html>
